<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Character</title>
    <link rel="stylesheet" href="styles/CreateCharacterPage.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title">Create Character</h1>
        <div id="error-panel" class="error-panel"></div>
        <form class="character-form" onsubmit="createCharacterFile(event)">
            <label for="character-name" class="form-label">Character Name:</label>
            <input type="text" id="character-name" name="character-name" class="form-input" placeholder="Enter character's name">
            <button type="submit" class="button create-button">Create Character</button>
        </form>
        <h2>Saved Games</h2>
        <div id="saved-games-list">
            <!-- Saved games will be displayed here -->
        </div>
    </div>
    <script>
        async function createCharacterFile(event) {
            event.preventDefault();
            const characterName = document.getElementById('character-name').value;
            const errorPanel = document.getElementById('error-panel');
            errorPanel.textContent = ''; // Clear previous error

            if (characterName.trim() === '') {
                showError('Please enter a character name.');
                return;
            }

            const response = await fetch('https://jobs-game.netlify.app/.netlify/functions/server/create-character', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ characterName })
            });

            if (response.ok) {
                alert('Character file created successfully!');
                loadSavedGames();
            } else {
                const errorMessage = await response.text();
                showError(errorMessage);
            }
        }

        async function loadSavedGames() {
            const response = await fetch('https://jobs-game.netlify.app/.netlify/functions/server/list-saves');
            const saveFiles = await response.json();
            const savedGamesList = document.getElementById('saved-games-list');
            savedGamesList.innerHTML = '';

            saveFiles.forEach(saveFile => {
                const loadButton = document.createElement('button');
                loadButton.textContent = `${saveFile.characterName}`;
                loadButton.addEventListener('click', () => {
                    loadSaveGame(saveFile.fileName);
                });
                savedGamesList.appendChild(loadButton);
            });
        }

        async function loadSaveGame(fileName) {
            const response = await fetch(`https://jobs-game.netlify.app/.netlify/functions/server/load-save/${fileName}`);
            const saveData = await response.text();

            // Store saveData or fileName in local storage or session storage
            localStorage.setItem('saveData', saveData);

            window.location.href = 'GameHomePage.html';
        }

        function showError(message) {
            const errorPanel = document.getElementById('error-panel');
            errorPanel.textContent = message;
            setTimeout(() => {
                errorPanel.textContent = '';
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', loadSavedGames);
    </script>
</body>
</html>
