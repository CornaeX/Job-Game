<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pond</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles/Fishing.css">
    <script src="scripts/cheats.js"></script>
</head>

<body>
    <div class="container">
        <div class="ErrorDiv" id="Error">asdasd</div>
        <div class="navigation">
            <div class="main-header" style="justify-content: center;">
                <h1>Job's Game</h1>
            </div>
            <a href="/home"><i class="fas fa-home"></i> Home</a>
            <a href="#"><i class="fas fa-user"></i> My Profile</a>
            <a href="/create-character" id="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
        <div class="main-content">
            <div class="header">
                <button class="back-button" onclick="window.location.href='/home'">Back</button>
                <h1 id="username">Pond</h1>
                <div id="seedSelect-container" class="seedSelect-container">
                    <span id="seedCountElement">Fishing bait</span>
                </div>
            </div>

            <div class="content">
                <div id="select-seed-tab" class="select-seed-tab" style="display: none;">
                    <h2>Fishing bait</h2>
                    <p>Choose the baits you want to use.</p>
                    <div class="seed-option" id="seed-option">

                    </div>
                </div>

                <div class="content">
                    <div id="message" style="position: absolute; "></div>
                    <div class="fishing-game">
                        <div class="pond-container">
                            <img src="img/Fishing/waterBG.jpg" class="pond-image">
                            <div class="fish-container">
                                <img src="img/Fishing/Fish.png" id="fishImage">
                            </div>
                        </div>
                    </div>

                    <!-- Move the mini-game container here -->
                    <div id="bar" style=" display: none;">
                        <div id="line" style=" display: none;"></div>
                        <div id="target" style=" display: none;"></div>
                    </div>
                    <button class="catch-button-dark" id="catchButtonDark" style=" display: none;">Catch!</button>
                    <button class="catch-button" id="catchButton" style=" display: none;">Catch!</button>
                </div>

            </div>
            <div class="status-bar">
                <p id="cash">Money: $0</p>
            </div>
        </div>
    </div>
    <script>
        let characterName = localStorage.getItem('characterName');
        // GLOBAL VARIABLE TO TRACK SELECTED BAIT
        let currentSelectedBait = null; 
    
        document.getElementById('seedSelect-container').addEventListener('click', function () {
            const tab = document.getElementById('select-seed-tab');
            tab.style.display = (tab.style.display === 'block') ? 'none' : 'block';
        });
    
        document.addEventListener('DOMContentLoaded', async () => {
            function updateUI(characterName, money) {
                document.getElementById('username').textContent = `${characterName} Farm`;
                document.getElementById('cash').textContent = `Money $${money}`;
            }
    
            // Updated to handle array or single item updates
            function updateSeedUI(inventory) {
                const SeedPanel = document.getElementById('seed-option');
                SeedPanel.innerHTML = ''; // Clear existing buttons to prevent duplicates
                
                const baitList = ["Worms", "Lures", "Minnow"]; // Allowed baits
                
                inventory.forEach(function (item) {
                    var parts = item.split('-');
                    var itemType = parts[0];
                    var itemCount = parts[1];
                    
                    if (baitList.includes(itemType)) {
                        var button = document.createElement('button');
                        button.className = 'seed-select-button';
                        button.setAttribute('type', 'button');
                        // Pass the type and count
                        button.setAttribute('onclick', `selectSeed('${itemType}', ${itemCount})`);
                        button.setAttribute('id', `btn-${itemType}`);
                        button.textContent = `${itemType}: ${itemCount}`;
                        SeedPanel.appendChild(button);
                        
                        // Update the main display if this is the currently selected bait
                        if(currentSelectedBait === itemType) {
                            document.getElementById('seedCountElement').textContent = `${itemType}: ${itemCount}`;
                        }
                    }
                });
            }
    
            async function fetchCharacterData(name) {
                const res = await fetch(`/get-character-data?characterName=${name}`);
                return await res.json();
            }
    
            async function fetchCharacterInvData(name) {
                const res = await fetch(`/load-inventory/${name}`);
                return await res.json();
            }
    
            const data = await fetchCharacterData(characterName);
            if (data) updateUI(data.Character_Name, data.Money);
    
            const inv = await fetchCharacterInvData(characterName);
            if (inv) updateSeedUI(inv);
            
            // Expose update function globally so we can refresh UI after fishing
            window.refreshInventoryUI = updateSeedUI; 
        });
    
        function selectSeed(seedType, seedCount) {
            // SET THE GLOBAL BAIT VARIABLE
            currentSelectedBait = seedType;
            
            const span_seed = document.getElementById('seedCountElement');
            span_seed.textContent = `${seedType}: ${seedCount}`;
            document.getElementById('select-seed-tab').style.display = 'none';
        }
    
        // --- GAME LOGIC ---
        document.addEventListener('DOMContentLoaded', () => {
            const fishImage = document.getElementById('fishImage');
            const catchButton = document.getElementById('catchButton');
            const catchButtonDark = document.getElementById('catchButtonDark');
            const message = document.getElementById('message');
            const line = document.getElementById('line');
            const target = document.getElementById('target');
            const bar = document.getElementById('bar');
            
            let targetPosition;
            let success = false;
            let gameTimeout;
            let isMiniGameStarted = false;
    
            // ... [Keep getRandomPosition, getRandomFadeDuration functions the same] ...
            function getRandomPosition() {
                const pondContainer = document.querySelector('.pond-container');
                return { 
                    x: Math.random() * (pondContainer.offsetWidth - fishImage.offsetWidth), 
                    y: Math.random() * (pondContainer.offsetHeight - fishImage.offsetHeight) 
                };
            }
    
            function showFish() {
                const { x, y } = getRandomPosition();
                fishImage.style.left = `${x}px`;
                fishImage.style.top = `${y}px`;
                // Simplified animation logic for brevity
                fishImage.style.transition = `opacity 1s`;
                fishImage.style.opacity = 1;
                setTimeout(() => {
                    fishImage.style.opacity = 0;
                    setTimeout(showFish, 1500); 
                }, 2000);
            }
    
            fishImage.addEventListener('click', () => {
                // CHECK IF BAIT IS SELECTED
                if (!currentSelectedBait) {
                    message.textContent = "You need to select bait first!";
                    message.classList.remove('fade-out');
                    setTimeout(() => message.classList.add('fade-out'), 2000);
                    return;
                }
    
                // Check if user has ammo (visually check the text content)
                const currentLabel = document.getElementById('seedCountElement').textContent;
                const currentCount = parseInt(currentLabel.split(':')[1]);
                
                if (currentCount <= 0) {
                    message.textContent = "You are out of this bait!";
                    return;
                }
    
                fishImage.style.display = 'none';
                catchButtonDark.style.display = 'block';
                waitForCursorOnCatchButton();
            });
    
            function waitForCursorOnCatchButton() {
                catchButtonDark.addEventListener('mouseover', function handler() {
                    catchButtonDark.style.display = 'none';
                    catchButton.style.display = 'block';
                    if (!isMiniGameStarted) {
                        isMiniGameStarted = true;
                        showMiniGame();
                    }
                    catchButton.removeEventListener('mouseover', handler);
                });
            }
    
            catchButton.addEventListener('click', async () => {
                clearTimeout(gameTimeout);
                const lineRect = line.getBoundingClientRect();
                const targetRect = target.getBoundingClientRect();
                const detectionMargin = 5;
    
                // Determine Success Locally
                success = (
                    lineRect.left + detectionMargin >= targetRect.left &&
                    lineRect.right - detectionMargin <= targetRect.right
                );
    
                // --- CALL SERVER TO PROCESS RESULT ---
                try {
                    const response = await fetch('/process-fishing', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            characterName: characterName,
                            baitType: currentSelectedBait,
                            success: success
                        })
                    });
    
                    const result = await response.json();
    
                    if (response.ok) {
                        message.textContent = result.message; // "You caught a Trout!" or "Bait lost..."
                        
                        // Update Inventory UI with new data from server
                        window.refreshInventoryUI(result.newInventory);
                    } else {
                        message.textContent = result.error || "Error processing fishing.";
                    }
    
                } catch (error) {
                    console.error(error);
                    message.textContent = "Server error.";
                }
    
                setTimeout(() => { message.classList.add('fade-out'); }, 2000);
                message.classList.remove('fade-out');
                hideMiniGame();
            });
    
            function showMiniGame() {
                const targetWidth = Math.random() * 20 + 20; // Slightly easier
                target.style.width = targetWidth + 'px';
                targetPosition = Math.random() * (280 - targetWidth);
                target.style.left = targetPosition + 'px';
    
                success = false;
                bar.style.display = 'block';
                line.style.animationPlayState = 'running';
                line.style.display = 'block';
                target.style.display = 'block';
    
                gameTimeout = setTimeout(async () => {
                    if (!success) {
                        message.textContent = "Time's up! Bait lost.";
                        
                        // Consume bait even on timeout
                        await fetch('/process-fishing', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                characterName: characterName,
                                baitType: currentSelectedBait,
                                success: false
                            })
                        }).then(res => res.json()).then(data => {
                            if(data.newInventory) window.refreshInventoryUI(data.newInventory);
                        });
    
                        hideMiniGame();
                        setTimeout(() => message.classList.add('fade-out'), 2000);
                        message.classList.remove('fade-out');
                    }
                }, 4000);
            }
    
            function hideMiniGame() {
                line.style.animationPlayState = 'paused';
                bar.style.display = 'none';
                catchButton.style.display = 'none';
                fishImage.style.display = 'block';
                isMiniGameStarted = false;
            }
    
            showFish();
        });
        
        // Logout logic
        document.getElementById('logout-link').addEventListener('click', () => {
            localStorage.removeItem('characterName');
            window.location.href = '/create-character';
        });
    </script>
</body>

</html>
